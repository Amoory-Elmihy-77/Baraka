version: '3.8'

services:
  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: baraka-backend
    ports:
      - "5001:5001"
    # We load environment variables from the back/.env file or local shell environment
    env_file:
      - ./back/.env
    environment:
      - PORT=5001
    restart: unless-stopped
    networks:
      - baraka-network

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: baraka-frontend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      # Ensure this matches the backend port exposed to the host machine.
      # Because this runs in the user's browser, localhost connects to the host machine.
      - NEXT_PUBLIC_API_URL=http://localhost:5001/api
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - baraka-network

networks:
  baraka-network:
    driver: bridge
